    <script>
      // Applies the saved theme choice before first paint, so a visitor who
      // pinned a theme never sees the other one flash first. Inline and tiny
      // for that reason; the toggle itself lives in src/components/ThemeToggle.
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.dataset.theme = saved;
        }
      } catch (e) {
        /* private window or blocked site data: follow the OS */
      }
    </script>
